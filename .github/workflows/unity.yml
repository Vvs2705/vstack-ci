# Workflow reutilizável de Unity com GameCI (EditMode + builds Windows/Android).
# Chamado pelos jogos com `uses: Vvs2705/vstack-ci/.github/workflows/unity.yml@main`; veja o README.
# Baseado no unity.yml do Tiny Airport Empire (PR #72).
name: unity (reutilizável)
on:
  workflow_call:
    inputs:
      project-path:
        type: string
        default: client
      unity-version:
        type: string
        default: 6000.3.27f1
      build-android:
        type: boolean
        default: true
      build-windows:
        type: boolean
        default: true
      build-method-android:
        type: string
        default: ''
      build-method-windows:
        type: string
        default: ''
    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  pre:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.v.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ inputs.project-path }}/ProjectSettings
      - id: v
        run: |
          ok=true
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::warning ::Faltam os segredos UNITY_LICENSE, UNITY_EMAIL ou UNITY_PASSWORD: Unity pulado."; ok=false
          fi
          if [ ! -f "${{ inputs.project-path }}/ProjectSettings/ProjectVersion.txt" ]; then
            echo "::warning ::Sem projeto Unity em ${{ inputs.project-path }} (jogo ainda não começou): Unity pulado."; ok=false
          fi
          echo ok=$ok >> "$GITHUB_OUTPUT"

  editmode:
    needs: pre
    if: needs.pre.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ inputs.project-path }}/Library
          key: Library-editmode-${{ hashFiles(format('{0}/Packages/**', inputs.project-path), format('{0}/ProjectSettings/**', inputs.project-path)) }}-${{ hashFiles(format('{0}/Assets/**', inputs.project-path)) }}
          restore-keys: Library-editmode-${{ hashFiles(format('{0}/Packages/**', inputs.project-path), format('{0}/ProjectSettings/**', inputs.project-path)) }}-
      - uses: game-ci/unity-test-runner@v4
        with:
          projectPath: ${{ inputs.project-path }}
          unityVersion: ${{ inputs.unity-version }}
          testMode: editmode
          artifactsPath: editmode
          githubToken: ${{ github.token }}
          checkName: EditMode (resultado)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-logs
          path: |
            editmode
            ${{ inputs.project-path }}/Logs
          retention-days: 14
          if-no-files-found: ignore

  build:
    needs: pre
    if: needs.pre.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        alvo: [StandaloneWindows64, Android]
    name: build (${{ matrix.alvo }})
    steps:
      - name: Alvo desligado?
        id: alvo
        run: |
          if [ "${{ matrix.alvo }}" = "Android" ] && [ "${{ inputs.build-android }}" != "true" ]; then echo run=false >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.alvo }}" = "StandaloneWindows64" ] && [ "${{ inputs.build-windows }}" != "true" ]; then echo run=false >> "$GITHUB_OUTPUT"
          else echo run=true >> "$GITHUB_OUTPUT"; fi
      - name: Libera disco
        if: steps.alvo.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null
          df -h /
      - uses: actions/checkout@v4
        if: steps.alvo.outputs.run == 'true'
      - uses: actions/cache@v4
        if: steps.alvo.outputs.run == 'true'
        with:
          path: ${{ inputs.project-path }}/Library
          key: Library-${{ matrix.alvo }}-${{ hashFiles(format('{0}/Packages/**', inputs.project-path), format('{0}/ProjectSettings/**', inputs.project-path)) }}-${{ hashFiles(format('{0}/Assets/**', inputs.project-path)) }}
          restore-keys: Library-${{ matrix.alvo }}-${{ hashFiles(format('{0}/Packages/**', inputs.project-path), format('{0}/ProjectSettings/**', inputs.project-path)) }}-
      - uses: game-ci/unity-builder@v4
        if: steps.alvo.outputs.run == 'true'
        with:
          projectPath: ${{ inputs.project-path }}
          unityVersion: ${{ inputs.unity-version }}
          targetPlatform: ${{ matrix.alvo }}
          buildMethod: ${{ matrix.alvo == 'Android' && inputs.build-method-android || inputs.build-method-windows }}
          versioning: None
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        if: always() && steps.alvo.outputs.run == 'true'
        with:
          name: build-${{ matrix.alvo }}-logs
          path: |
            ${{ inputs.project-path }}/Builds/build_*.txt
            ${{ inputs.project-path }}/Logs
          retention-days: 14
          if-no-files-found: ignore
